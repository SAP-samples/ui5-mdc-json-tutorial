specVersion: '3.0'
metadata:
  name: sap.ui.stores
  allowSapInternal: true
type: application
customConfiguration:
  mountPath: /stores
framework:
  name: SAPUI5
  version: "1.148.1"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ui.mdc
    - name: sap.ui.geomap
    - name: sap.ui.fl
    - name: sap.f
    - name: sap.uxap
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-middleware-cap
      afterMiddleware: compression
    - name: ui5-middleware-livereload
      afterMiddleware: compression
