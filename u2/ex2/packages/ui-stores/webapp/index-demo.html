<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Store Explorer - Demo</title>
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.148.1/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{ "sap.ui.stores": "./" }'
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted"
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport">
    </script>
</head>
<body class="sapUiBody" id="content">
    <div data-sap-ui-component
         data-name="sap.ui.stores"
         data-id="container"
         data-settings='{ "id": "sap.ui.stores" }'
         data-url="./">
    </div>
</body>
</html>
